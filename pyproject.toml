[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "librefren"
version = "0.1.0"
description = "Evidence-led Linux firmware preparation and research companion"
requires-python = ">=3.11"
license = {file = "LICENSE"}

[project.scripts]
librefren = "librefren.app:main"

[tool.setuptools.packages.find]
include = ["librefren*"]

[tool.setuptools.package-data]
librefren = ["data/*.json"]
