name: Test and package preview
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install -r packaging/requirements.txt
      - name: Obtain pinned AppImage tooling
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage -o /tmp/appimagetool
          curl --fail --location --proto '=https' --tlsv1.2 https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64 -o /tmp/appimage-runtime
          chmod +x /tmp/appimagetool /tmp/appimage-runtime
      - name: Build AppImage
        run: >-
          python packaging/build_appimage.py
          --appimagetool /tmp/appimagetool --runtime /tmp/appimage-runtime
          --tool-sha256 ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          --runtime-sha256 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
      - name: Smoke test without FUSE
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 dist/LibreFren-0.1.0-x86_64.AppImage --help
          APPIMAGE_EXTRACT_AND_RUN=1 dist/LibreFren-0.1.0-x86_64.AppImage boards --project rboot --search macbook
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: librefren-x86_64
          path: dist/LibreFren-*
  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: appimage
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: librefren-x86_64
          path: dist
      - name: Create or refresh the unpublished draft preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: sh packaging/publish_draft.sh
