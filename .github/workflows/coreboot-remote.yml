name: Build a coreboot candidate
run-name: LibreFren coreboot ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      target:
        description: Exact bundled BOARD selector
        required: true
        type: string
      allow_blobs:
        description: Permit upstream binary repositories (no uploaded vendor files)
        required: true
        default: false
        type: boolean
      request_id:
        description: LibreFren request ID (32 lowercase hexadecimal characters)
        required: true
        type: string
      expected_sha:
        description: Reviewed LibreFren commit (40 lowercase hexadecimal characters)
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate the request before installing dependencies
        env:
          BUILD_TARGET: ${{ inputs.target }}
          BUILD_REQUEST_ID: ${{ inputs.request_id }}
          BUILD_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          python3 - <<'PY'
          import os, re
          from librefren.coreboot import board_record
          board_record(os.environ['BUILD_TARGET'])
          assert re.fullmatch('[a-f0-9]{32}', os.environ['BUILD_REQUEST_ID'])
          assert re.fullmatch('[a-f0-9]{40}', os.environ['BUILD_EXPECTED_SHA'])
          assert os.environ['BUILD_EXPECTED_SHA'] == os.environ['GITHUB_SHA']
          PY
      - name: Install dependencies on the disposable GitHub runner
        run: |
          sudo apt-get update
          sudo apt-get install -y bison build-essential curl flex git gnat libncurses-dev libssl-dev zlib1g-dev pkgconf python-is-python3 nasm
      - name: Configure and build the exact target
        env:
          BUILD_TARGET: ${{ inputs.target }}
          BUILD_ALLOW_BLOBS: ${{ inputs.allow_blobs }}
          BUILD_REQUEST_ID: ${{ inputs.request_id }}
          BUILD_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python3 tools/build_coreboot_remote.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coreboot-candidate-${{ inputs.request_id }}
          path: build/remote/candidate/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coreboot-build-evidence-${{ inputs.request_id }}
          path: build/remote/evidence/
          retention-days: 7
