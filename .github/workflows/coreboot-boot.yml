name: Diagnose a built emulation candidate
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful coreboot remote build run in this repository
        required: true
        type: string
      request_id:
        description: Exact request ID of that emulation build
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install emulator only
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86
      - name: Verify existing candidate and inspect boot behavior
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          BUILD_REQUEST_ID: ${{ inputs.request_id }}
        run: python3 tools/check_remote_emulation.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coreboot-boot-evidence
          path: build/remote-emulation/evidence/
          retention-days: 14
